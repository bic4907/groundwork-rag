[project]
name = "groundwork-rag"
version = "0.1.0"
description = "Evidence-first question answering and reproducible retrieval experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "rank-bm25>=0.2.2,<0.3",
  "pyyaml>=6,<7",
  "typer>=0.15,<1",
  "pyarrow>=26.0.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
groundwork = "groundwork.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
